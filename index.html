<style>
:root{--bg:#08111f;--panel:#111e33;--card:#162840;--line:#2c4261;--text:#e8eef8;--muted:#9aacc4;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,"Noto Sans TC",sans-serif}.app{max-width:1450px;margin:auto;padding:24px}header,.head,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:3px;color:#93c5fd}h1{font-size:25px;margin:7px 0}.muted{color:var(--muted)}.tag{font-size:11px;background:#263b59;color:#d4e4fa;padding:4px 9px;border-radius:20px}
.tag.priority-low{background:#00B078;color:#fff}
.tag.priority-normal{background:#0081B0;color:#fff}
.tag.priority-high{background:#DE9610;color:#fff}
.tag.priority-urgent{background:#D65151;color:#fff}
.layout{display:flex;gap:20px}.sidebar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.sidebar{width:190px;padding:12px;height:max-content;flex-shrink:0}.nav{display:block;width:100%;text-align:left;padding:11px;border:0;border-radius:8px;background:none;color:#a9bad1;margin:3px 0;cursor:pointer}.nav.active{background:#1e3a60;color:white}main{flex:1;min-width:0}.mobile{display:none;gap:6px;overflow:auto;margin-bottom:14px}.mobile button{white-space:nowrap}.head{margin-bottom:16px}.head h2{margin:0 0 5px}.filters{display:flex;gap:9px;flex-wrap:wrap;padding:12px;margin-bottom:14px}.filters input{flex:2;min-width:180px}.filters select{flex:1;min-width:120px}input,select,textarea{background:#0b1729;color:var(--text);border:1px solid #344b6b;border-radius:8px;padding:10px;width:100%;font:inherit}button{font:inherit;cursor:pointer}.primary,.secondary{border-radius:9px;padding:9px 14px;font-weight:600}.primary{background:var(--blue);color:white;border:1px solid var(--blue)}.secondary{background:#1b2c45;color:#dbeafe;border:1px solid #344b6b}.small{font-size:12px;padding:7px 10px}.list{display:grid;gap:12px}.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.item h3{font-size:18px;margin:13px 0 5px}.row{justify-content:flex-start}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.sub{background:#0b1729;border-radius:9px;padding:12px}.sub small,.label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.section{font-size:13px;color:#93c5fd;font-weight:bold;margin:16px 0 8px}.log{border-left:2px solid #3b82f6;padding:0 0 13px 13px;margin:10px 0 0 5px}.note{background:#0b1729;border-radius:9px;padding:12px;margin-top:13px}.note-title{color:#93c5fd;font-size:12px;margin-bottom:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:35px;color:var(--muted)}.footer{font-size:12px;color:var(--muted);margin-top:18px}.modal{position:fixed;inset:0;background:#020817dd;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.hidden{display:none}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #344b6b;border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.field{margin-bottom:12px}.field label{display:block;color:#a9bad1;font-size:12px;margin-bottom:5px}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#1d4ed8;padding:12px 16px;border-radius:9px;z-index:8}.auth{max-width:440px;margin:9vh auto;padding:26px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.auth .field{margin-top:14px}.hidden{display:none!important}.error{color:#fca5a5;font-size:13px;margin-top:10px}
@media(max-width:700px){.app{padding:14px}.sidebar{display:none}.mobile{display:flex}.grid2,.grid3{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<section class="auth" id="authPanel">
 <div class="eyebrow">EXECUTIVE BRIEFING</div><h1>營運長決策與事務管理系統</h1>
 <p class="muted">請使用已獲邀的帳號登入。此系統僅供管理者與營運長使用。</p>
 <form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%;margin-top:8px">登入</button></form>
 <div id="authError" class="error"></div><p class="muted" style="font-size:12px;margin-top:18px">尚未設定 Supabase？請先依照隨附的 supabase_setup.sql 與設定說明完成初始化。</p>
</section>
<div class="app hidden" id="app">
<header><div><div class="eyebrow">EXECUTIVE BRIEFING</div><h1>營運長決策與事務管理系統</h1><div class="muted">Executive Decision & Operations Management</div></div><div class="row"><span class="tag" id="userBadge">已登入</span><button class="secondary small" id="logout">登出</button></div></header>
<div class="mobile" id="mobileNav"></div><div class="layout"><aside class="sidebar"><div class="muted" style="padding:8px;font-size:12px">工作區</div><div id="sideNav"></div></aside>
<main><div class="head"><div><h2 id="pageTitle">待決策</h2><div class="muted" id="subtitle"></div></div><button class="primary" id="add">＋ 新增事項</button></div>
<div class="panel filters"><input id="search" placeholder="搜尋摘要、部門、窗口或內容…"><select id="priority"><option value="">全部優先級</option><option>緊急</option><option>高</option><option>一般</option><option>低</option></select><select id="dept"><option value="">全部部門</option><option>財務</option><option>設計</option><option>影音</option><option>PM</option><option>客服</option><option>營運</option><option>公關</option><option>其他</option></select></div>
<div id="content" class="list"></div><div class="footer">雲端資料庫：Supabase　·　登入帳號限管理者與營運長　·　資料異動會同步至其他已登入裝置</div></main></div></div>
<div class="modal hidden" id="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">新增事項</h3><button class="secondary small" id="close">關閉</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
// 先到 Supabase 專案的 Project Settings > API，填入 Project URL 與 anon/public key。
// 請勿在前端放入 service_role key。
const SUPABASE_URL="https://lqafjngfpxrlfzgvycez.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_pyK8DAJnQGVTH5GhM1FqSw_xajepp4v";
(()=>{
const $=id=>document.getElementById(id),tabs=['待決策','執行中','待追蹤','回報','回顧'],desc=['整理待營運長判斷的事項與方案','查看執行進度、負責人與期限','管理內外部回覆及下一次追蹤','呈報已完成事項與重要成果','查詢歷史事項、決策與追蹤紀錄'];
let page='待決策',items=[],client=null,channel=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(l,n,v='',type='text',ph='')=>`<div class="field"><label>${l}</label><input name="${n}" type="${type}" value="${esc(v)}" placeholder="${esc(ph)}"></div>`,area=(l,n,v='',ph='')=>`<div class="field"><label>${l}</label><textarea name="${n}" rows="3" placeholder="${esc(ph)}">${esc(v)}</textarea></div>`,select=(l,n,opts,v='')=>`<div class="field"><label>${l}</label><select name="${n}">${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
const close=()=>$('modal').classList.add('hidden'),toast=t=>{$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)};
function err(t){$('authError').textContent=t||''}
function priorityClass(p){return ({'低':'priority-low','一般':'priority-normal','高':'priority-high','緊急':'priority-urgent'})[p]||'priority-normal'}
async function load(){const {data,error}=await client.from('ops_items').select('id,payload,updated_at').order('id',{ascending:false});if(error){toast('讀取失敗：'+error.message);return}items=(data||[]).map(r=>({...r.payload,id:r.id}));render()}
async function persist(obj,id){let result;if(id)result=await client.from('ops_items').update({payload:obj,updated_at:new Date().toISOString()}).eq('id',id);else result=await client.from('ops_items').insert({payload:obj}).select('id').single();if(result.error){toast('儲存失敗：'+result.error.message);return false}await load();toast('雲端資料已儲存');return true}
function nav(){$('sideNav').innerHTML=tabs.map(t=>`<button class="nav ${page===t?'active':''}" data-nav="${t}">${t}</button>`).join('');$('mobileNav').innerHTML=tabs.map(t=>`<button class="secondary small" data-nav="${t}">${t}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()})}
function filtered(){let q=$('search').value.toLowerCase(),p=$('priority').value,d=$('dept').value;return items.filter(x=>(page==='回顧'||x.status===page)&&(!q||[x.projectNo,x.summary,x.dept,x.owner,x.email,JSON.stringify(x)].filter(Boolean).join(' ').toLowerCase().includes(q))&&(!p||x.priority===p)&&(!d||x.dept===d))}
function history(x){return(x.decision||[]).length?`<div class="section">決策歷程</div>${x.decision.map(h=>`<div class="log"><b>${esc(h.choice)}</b><div class="muted" style="font-size:12px">${esc(h.date)} · 營運長決策</div>${h.memo?esc(h.memo):''}</div>`).join('')}`:''}
function tracking(x){return(x.tracking||[]).length?`<div class="section">追蹤歷程（${x.tracking.length}）</div>${x.tracking.map((h,i)=>({...h,_index:i})).reverse().map(h=>`<div class="log"><b>${esc(h.person)} · ${esc(h.date)}</b><div>${esc(h.reply)}</div><div class="muted" style="font-size:12px">下一次追蹤：${esc(h.next||'未設定')}</div><div class="actions"><button class="secondary small" data-track-edit="${x.id}" data-track-index="${h._index}">編輯紀錄</button><button class="secondary small" data-track-delete="${x.id}" data-track-index="${h._index}">刪除紀錄</button></div></div>`).join('')}`:''}
function note(x){return `<div class="note"><div class="note-title">營運長註記</div>${esc(x.note||'尚無註記')}</div>`}
function card(x){let ex='';if(page==='待決策')ex=`<div class="grid3">${(x.options||['','','']).map((v,i)=>`<div class="sub"><small>方案 ${['一','二','三'][i]}</small>${esc(v||'未填寫')}</div>`).join('')}</div><p><span style="color:#93c5fd">秘書建議：</span>${esc(x.recommend||'未填寫')}</p><p><span class="muted">待追蹤：</span>${esc(x.follow||'—')}</p>${history(x)}`;
if(page==='執行中')ex=`<p>${esc(x.progress||'—')}</p><div class="muted" style="font-size:12px">負責人：${esc(x.owner||'—')}　期限：${esc(x.deadline||'未設定')}</div>${history(x)}`;
if(page==='待追蹤')ex=`<div class="grid2"><div><span class="label">追蹤對象</span>${esc(x.target||'—')}</div><div><span class="label">下次追蹤日</span>${esc(x.next||'未設定')}</div></div>${tracking(x)}${note(x)}`;
if(page==='回報')ex=`<p>${esc(x.result||'—')}</p><div class="muted" style="font-size:12px">回報日期：${esc(x.reportDate||'—')}</div>${note(x)}`;
if(page==='回顧')ex=`<div class="grid2"><div><span class="label">建立日期</span>${esc(x.created||'—')}</div><div><span class="label">決策／回報日期</span>${esc(x.reportDate||x.decision?.at(-1)?.date||'—')}</div></div>${history(x)}${tracking(x)}${x.note?note(x):''}`;
return `<article class="item"><div class="row between"><div class="row"><span class="tag ${priorityClass(x.priority||'一般')}">${esc(x.priority||'一般')}優先</span><span class="tag">${esc(x.dept||'其他')}</span><span class="tag">${esc(x.status)}</span></div><div class="row"><button class="secondary small" data-edit="${x.id}">編輯</button><button class="secondary small" data-move="${x.id}">移動狀態</button><button class="secondary small" data-delete="${x.id}">刪除事項</button></div></div><h3>${esc(x.summary)}</h3>${x.projectNo?`<div class="muted" style="font-size:12px;margin-bottom:5px">專案編號：${esc(x.projectNo)}</div>`:''}<div class="muted" style="font-size:12px">窗口：${esc(x.owner||'未指派')} ${x.email?'· '+esc(x.email):''}</div>${ex}<div class="muted" style="font-size:12px;margin-top:12px">參考資料：${esc(x.refs||'—')}</div>${page==='待決策'?`<div class="actions"><button class="secondary small" data-decision="${x.id}">＋ 營運長決策</button></div>`:''}${['待追蹤','回報'].includes(page)?`<div class="actions"><button class="secondary small" data-note="${x.id}">＋ 營運長註記</button>${page==='待追蹤'?`<button class="secondary small" data-track="${x.id}">＋ 新增追蹤紀錄</button>`:''}</div>`:''}</article>`}
function render(){nav();$('pageTitle').textContent=page;$('subtitle').textContent=desc[tabs.indexOf(page)];let list=filtered();$('content').innerHTML=list.length?list.map(card).join(''):'<div class="panel empty">目前沒有符合條件的事項</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(+b.dataset.edit));document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(+b.dataset.move));document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>action(+b.dataset.decision,'decision'));document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>action(+b.dataset.track,'track'));document.querySelectorAll('[data-track-edit]').forEach(b=>b.onclick=()=>action(b.dataset.trackEdit,'track',Number(b.dataset.trackIndex)));document.querySelectorAll('[data-track-delete]').forEach(b=>b.onclick=()=>deleteTracking(b.dataset.track,Number(b.dataset.trackIndex)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteItem(+b.dataset.delete));document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>noteForm(+b.dataset.note))}
function form(id=null){let x=items.find(z=>z.id===id)||{status:page,priority:'一般',dept:'PM',decision:[],tracking:[]};const depts=['財務','設計','影音','PM','客服','營運','公關','其他'],known=depts.slice(0,-1),isCustom=x.dept&&!known.includes(x.dept),deptChoice=isCustom?'其他':(x.dept||'其他');$('modalTitle').textContent=id?'編輯事項':'新增事項';$('modalBody').innerHTML=`<form id="itemForm"><div class="grid2">${field('專案編號','projectNo',x.projectNo)}${field('事項摘要','summary',x.summary)}${select('狀態','status',tabs.slice(0,4),x.status||'待決策')}${select('優先級','priority',['低','一般','高','緊急'],x.priority||'一般')}${select('所屬部門','deptChoice',depts,deptChoice)}<div class="field" id="customDeptField" style="display:${deptChoice==='其他'?'block':'none'}"><label>其他部門名稱</label><input name="customDept" value="${esc(isCustom?x.dept:'')}" placeholder="請輸入部門名稱"></div>${field('內部窗口姓名','owner',x.owner)}${field('窗口 Email','email',x.email,'email')}</div><div id="decisionFields"><div class="section">待決策資訊</div><div class="grid3">${field('方案一','o1',x.options?.[0])}${field('方案二','o2',x.options?.[1])}${field('方案三','o3',x.options?.[2])}</div>${area('秘書建議','recommend',x.recommend)}${area('待追蹤事項','follow',x.follow)}</div><div id="executionFields"><div class="section">執行資訊</div>${area('執行方式／目前進度','progress',x.progress)}${field('預計期限','deadline',x.deadline,'date')}</div><div id="trackingFields"><div class="section">追蹤資訊</div>${field('追蹤對象','target',x.target)}${field('下次追蹤日期','next',x.next,'date')}</div><div id="reportFields"><div class="section">回報資訊</div>${area('完成成果','result',x.result)}${field('回報日期','reportDate',x.reportDate,'date')}</div>${field('參考資料／連結','refs',x.refs)}${['待追蹤','回報'].includes(x.status)?area('營運長註記','note',x.note):''}<div class="actions" style="justify-content:flex-end"><button type="button" class="secondary" id="cancel">取消</button><button class="primary">儲存事項</button></div></form>`;$('modal').classList.remove('hidden');let toggle=()=>{let st=$('itemForm').elements.status.value;[['decisionFields','待決策'],['executionFields','執行中'],['trackingFields','待追蹤'],['reportFields','回報']].forEach(([id,v])=>$(id).style.display=st===v?'block':'none');$('customDeptField').style.display=$('itemForm').elements.deptChoice.value==='其他'?'block':'none'};$('itemForm').elements.status.onchange=toggle;$('itemForm').elements.deptChoice.onchange=toggle;toggle();$('cancel').onclick=close;$('itemForm').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries()),dept=v.deptChoice==='其他'?(v.customDept.trim()||'其他'):v.deptChoice,obj={...x,...v,dept,options:[v.o1,v.o2,v.o3],created:x.created||new Date().toISOString().slice(0,10),decision:x.decision||[],tracking:x.tracking||[]};delete obj.o1;delete obj.o2;delete obj.o3;delete obj.deptChoice;delete obj.customDept;await persist(obj,id)}}
function move(id){let x=items.find(z=>z.id===id),v=prompt('請輸入新狀態：待決策／執行中／待追蹤／回報',x.status);if(!tabs.slice(0,4).includes(v))return;x.status=v;persist(x,id)}
function action(id,type,trackIndex=null){let x=items.find(z=>String(z.id)===String(id)),decision=type==='decision',editingTrack=type==='track'&&trackIndex!==null,oldTrack=editingTrack?(x.tracking||[])[trackIndex]:{};$('modalTitle').textContent=decision?'新增決策紀錄':editingTrack?'編輯追蹤紀錄':'新增追蹤紀錄';$('modalBody').innerHTML=decision?`<form id="actionForm">${select('營運長最後選擇方案','choice',(x.options||[]).filter(Boolean).length?x.options.filter(Boolean):['方案一','方案二','方案三'])}${field('決策日期','date',new Date().toISOString().slice(0,10),'date')}${area('決策補充說明','memo')}<div class="actions" style="justify-content:flex-end"><button type="button" class="secondary" id="cancel">取消</button><button class="primary">保存決策紀錄</button></div></form>`:`<form id="actionForm">${field('聯絡對象','person',oldTrack.person||x.target)}${field('聯絡日期','date',oldTrack.date||new Date().toISOString().slice(0,10),'date')}${area('回覆內容','reply',oldTrack.reply||'')}${field('下一次追蹤日期','next',oldTrack.next||'','date')}<div class="actions" style="justify-content:flex-end"><button type="button" class="secondary" id="cancel">取消</button><button class="primary">${editingTrack?'更新追蹤紀錄':'保存追蹤紀錄'}</button></div></form>`;$('modal').classList.remove('hidden');$('cancel').onclick=close;$('actionForm').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());if(decision){x.decision=x.decision||[];x.decision.push(v);x.status='執行中'}else{x.tracking=x.tracking||[];if(editingTrack)x.tracking[trackIndex]=v;else x.tracking.push(v);x.target=v.person;x.next=v.next}await persist(x,id)}} 
async function deleteTracking(id,index){
 let x=items.find(z=>String(z.id)===String(id));
 if(!x){toast('找不到這筆事項，請重新整理後再試');return}
 const current=Array.isArray(x.tracking)?x.tracking:[];
 if(!Number.isInteger(index)||index<0||index>=current.length){toast('找不到這筆追蹤紀錄，請重新整理後再試');return}
 if(!window.confirm('確定刪除此筆追蹤紀錄？此操作無法復原。'))return;
 const payload={...x,tracking:current.filter((_,i)=>i!==index)};
 delete payload.id;
 const {data,error}=await client.from('ops_items').update({payload,updated_at:new Date().toISOString()}).eq('id',id).select('id').maybeSingle();
 if(error){toast('刪除失敗：'+error.message);return}
 if(!data){toast('刪除未成功：資料庫沒有更新任何事項，請確認登入權限後重試');return}
 await load();
 toast('追蹤紀錄已刪除');
}
async function deleteItem(id){if(!confirm('確定刪除此整筆事項？包含其決策與追蹤歷程都會一併刪除，且無法復原。'))return;const {error}=await client.from('ops_items').delete().eq('id',id);if(error){toast('刪除失敗：'+error.message);return}await load();toast('事項已刪除')}
function noteForm(id){let x=items.find(z=>z.id===id);$('modalTitle').textContent='營運長註記';$('modalBody').innerHTML=`<form id="noteForm">${area('營運長註記','note',x.note,'輸入指示、補充意見或後續要求…')}<div class="actions" style="justify-content:flex-end"><button type="button" class="secondary" id="cancel">取消</button><button class="primary">儲存註記</button></div></form>`;$('modal').classList.remove('hidden');$('cancel').onclick=close;$('noteForm').onsubmit=async e=>{e.preventDefault();x.note=new FormData(e.target).get('note');await persist(x,id)}}
async function start(){if(!window.supabase||SUPABASE_URL.startsWith('YOUR_')||SUPABASE_ANON_KEY.startsWith('YOUR_')){err('尚未設定 Supabase URL 與 anon/public key。請依照設定說明修改 index.html。');return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);$('loginForm').onsubmit=async e=>{e.preventDefault();err('');let {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)err(error.message)};client.auth.onAuthStateChange(async(event,session)=>{if(session){$('authPanel').classList.add('hidden');$('app').classList.remove('hidden');$('userBadge').textContent=session.user.email;await load();if(channel)client.removeChannel(channel);channel=client.channel('ops-items-sync').on('postgres_changes',{event:'*',schema:'public',table:'ops_items'},()=>load()).subscribe()}else{$('app').classList.add('hidden');$('authPanel').classList.remove('hidden')}});$('logout').onclick=async()=>{await client.auth.signOut()}}
$('add').onclick=()=>form();$('close').onclick=close;$('search').oninput=render;$('priority').onchange=render;$('dept').onchange=render;start();
})();
</script></body></html>
