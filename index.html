<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>營運長決策與事務管理系統</title>
<style>
:root{--bg:#080f1d;--panel:#111e33;--card:#14243b;--line:#2a405e;--text:#e5edf8;--muted:#91a4bf;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,"Noto Sans TC",sans-serif}.app{max-width:1450px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:3px;color:#93c5fd}h1{font-size:25px;margin:8px 0}.muted{color:var(--muted)}.tag{font-size:11px;background:#263b59;color:#c9ddf7;padding:4px 9px;border-radius:20px}.layout{display:flex;gap:20px}.sidebar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.sidebar{width:190px;padding:12px;height:max-content;flex-shrink:0}.nav{display:block;width:100%;text-align:left;padding:11px;border:0;border-radius:8px;background:none;color:#a9bad1;margin:3px 0}.nav.active{background:#1e3a60;color:white}main{flex:1;min-width:0}.mobile{display:none;gap:6px;overflow:auto;margin-bottom:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.head h2{margin:0 0 5px}.filters{display:flex;gap:9px;flex-wrap:wrap;padding:12px;margin-bottom:14px}.filters input{flex:2;min-width:180px}.filters select{flex:1;min-width:120px}input,select,textarea{background:#0b1729;color:var(--text);border:1px solid #344b6b;border-radius:8px;padding:10px;width:100%;font:inherit}button{cursor:pointer;font:inherit}.primary,.secondary{border-radius:9px;padding:9px 14px;font-weight:600}.primary{background:var(--blue);color:white;border:1px solid var(--blue)}.secondary{background:#1b2c45;color:#dbeafe;border:1px solid #344b6b}.small{font-size:12px;padding:7px 10px}.list{display:grid;gap:12px}.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.item h3{font-size:18px;margin:13px 0 5px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.sub{background:#0b1729;border-radius:9px;padding:12px}.sub small,.label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.section{font-size:13px;color:#93c5fd;font-weight:bold;margin:16px 0 8px}.log{border-left:2px solid #3b82f6;padding:0 0 13px 13px;margin:10px 0 0 5px}.note{background:#0b1729;border-radius:9px;padding:12px;margin-top:13px}.note-title{color:#93c5fd;font-size:12px;margin-bottom:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:35px;color:var(--muted)}.footer{font-size:12px;color:var(--muted);margin-top:18px}.modal{position:fixed;inset:0;background:#020817dd;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.hidden{display:none}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #344b6b;border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.field{margin-bottom:12px}.field label{display:block;color:#a9bad1;font-size:12px;margin-bottom:5px}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#1d4ed8;padding:12px 16px;border-radius:9px}
@media(max-width:700px){.app{padding:14px}.sidebar{display:none}.mobile{display:flex}.grid2,.grid3{grid-template-columns:1fr}.head{align-items:flex-start}header{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="app">
<header><div><div class="eyebrow">EXECUTIVE BRIEFING</div><h1>營運長決策與事務管理系統</h1><div class="muted">Executive Decision & Operations Management</div></div><span class="tag">Prototype</span></header>
<div class="mobile" id="mobileNav"></div><div class="layout"><aside class="sidebar"><div class="muted" style="padding:8px;font-size:12px">工作區</div><div id="sideNav"></div></aside>
<main><div class="head"><div><h2 id="pageTitle">待決策</h2><div class="muted" id="subtitle"></div></div><button class="primary" id="add">＋ 新增事項</button></div>
<div class="panel filters"><input id="search" placeholder="搜尋摘要、部門、窗口或內容…"><select id="priority"><option value="">全部優先級</option><option>緊急</option><option>高</option><option>一般</option><option>低</option></select><select id="dept"><option value="">全部部門</option><option>財務</option><option>設計</option><option>影音</option><option>PM</option><option>其他</option></select></div>
<div id="content" class="list"></div><div class="footer">資料儲存在目前瀏覽器的 localStorage。正式多人使用需串接雲端資料庫、帳號權限及通知服務。</div></main></div></div>
<div class="modal hidden" id="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">新增事項</h3><button class="secondary small" id="close">關閉</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),tabs=['待決策','執行中','待追蹤','回報','回顧'],desc=['整理待營運長判斷的事項與方案','查看執行進度、負責人與期限','管理內外部回覆及下一次追蹤','呈報已完成事項與重要成果','查詢歷史事項、決策與追蹤紀錄'],KEY='executive_ops_standalone_v1';
let page='待決策',items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
if(!items.length)items=[
{id:1,status:'待決策',priority:'高',summary:'Q4 社群活動資源配置',dept:'PM',owner:'王小明',email:'pm@example.com',options:['維持原配置','增加影音資源','調整活動檔期'],recommend:'建議方案二，優先補足影音產能。',follow:'確認影音部門可投入人力與檔期。',refs:'專案企劃文件',created:'2026-11-01',decision:[],tracking:[],note:''},
{id:2,status:'待追蹤',priority:'一般',summary:'合作廠商報價確認',dept:'財務',owner:'陳小華',email:'finance@example.com',target:'合作廠商 A',next:'2026-11-06',tracking:[{person:'廠商 A／林小姐',date:'2026-11-02',reply:'已收到需求，預計週五前提供正式報價。',next:'2026-11-06'}],note:'請確認報價是否含稅及付款條件。'},
{id:3,status:'回報',priority:'一般',summary:'新版視覺公版完成',dept:'設計',owner:'李小美',email:'design@example.com',result:'完成新版公版與使用說明，已交付團隊。',reportDate:'2026-11-02',note:''},
{id:4,status:'執行中',priority:'緊急',summary:'AI 工具導入需求盤點',dept:'PM',owner:'王小明',progress:'已完成需求訪談，正在整理使用情境與導入優先級。',deadline:'2026-11-12',refs:'需求訪談紀錄',decision:[],tracking:[]},
{id:5,status:'待決策',priority:'一般',summary:'跨部門會議頻率調整',dept:'其他',owner:'陳小華',options:['每週一次','雙週一次','依專案需求召開'],recommend:'建議方案三，避免例行會議過多。',follow:'請確認各部門固定窗口。',refs:'會議紀錄',created:'2026-11-03',decision:[],tracking:[]}
];
const save=()=>localStorage.setItem(KEY,JSON.stringify(items)),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(l,n,v='',type='text',ph='')=>`<div class="field"><label>${l}</label><input name="${n}" type="${type}" value="${esc(v)}" placeholder="${esc(ph)}"></div>`,area=(l,n,v='',ph='')=>`<div class="field"><label>${l}</label><textarea name="${n}" rows="3" placeholder="${esc(ph)}">${esc(v)}</textarea></div>`,select=(l,n,opts,v='')=>`<div class="field"><label>${l}</label><select name="${n}">${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
const close=()=>$('modal').classList.add('hidden'),toast=t=>{$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2000)};
function nav(){$('sideNav').innerHTML=tabs.map(t=>`<button class="nav ${page===t?'active':''}" data-nav="${t}">${t}</button>`).join('');$('mobileNav').innerHTML=tabs.map(t=>`<button class="secondary small" data-nav="${t}">${t}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()})}
function filtered(){let q=$('search').value.toLowerCase(),p=$('priority').value,d=$('dept').value;return items.filter(x=>(page==='回顧'||x.status===page)&&(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!p||x.priority===p)&&(!d||x.dept===d))}
function history(x){return (x.decision||[]).length?`<div class="section">決策歷程</div>${x.decision.map(h=>`<div class="log"><b>${esc(h.choice)}</b><div class="muted" style="font-size:12px">${esc(h.date)} · 營運長決策</div>${h.memo?esc(h.memo):''}</div>`).join('')}`:''}
function tracking(x){return (x.tracking||[]).length?`<div class="section">追蹤歷程（${x.tracking.length}）</div>${x.tracking.slice().reverse().map(h=>`<div class="log"><b>${esc(h.person)} · ${esc(h.date)}</b><div>${esc(h.reply)}</div><div class="muted" style="font-size:12px">下一次追蹤：${esc(h.next||'未設定')}</div></div>`).join('')}`:''}
function note(x){return `<div class="note"><div class="note-title">營運長註記</div>${esc(x.note||'尚無註記')}</div>`}
function card(x){let extra='';if(page==='待決策')extra=`<div class="grid3">${(x.options||['','','']).map((v,i)=>`<div class="sub"><small>方案 ${['一','二','三'][i]}</small>${esc(v||'未填寫')}</div>`).join('')}</div><p><span style="color:#93c5fd">秘書建議：</span>${esc(x.recommend||'未填寫')}</p><p><span class="muted">待追蹤：</span>${esc(x.follow||'—')}</p>${history(x)}`;
if(page==='執行中')extra=`<p>${esc(x.progress||'—')}</p><div class="muted" style="font-size:12px">負責人：${esc(x.owner||'—')}　期限：${esc(x.deadline||'未設定')}</div>`;
if(page==='待追蹤')extra=`<div class="grid2"><div><span class="label">追蹤對象</span>${esc(x.target||'—')}</div><div><span class="label">下次追蹤日</span>${esc(x.next||'未設定')}</div></div>${tracking(x)}${note(x)}`;
if(page==='回報')extra=`<p>${esc(x.result||'—')}</p><div class="muted" style="font-size:12px">回報日期：${esc(x.reportDate||'—')}</div>${note(x)}`;
if(page==='回顧')extra=`<div class="grid2"><div><span class="label">建立日期</span>${esc(x.created||'—')}</div><div><span class="label">決策／回報日期</span>${esc(x.reportDate||x.decision?.at(-1)?.date||'—')}</div></div>${history(x)}${tracking(x)}${x.note?note(x):''}`;
return `<article class="item"><div class="row between"><div class="row"><span class="tag">${esc(x.priority||'一般')}優先</span><span class="tag">${esc(x.dept||'其他')}</span><span class="tag">${esc(x.status)}</span></div><div class="row"><button class="secondary small" data-edit="${x.id}">編輯</button><button class="secondary small" data-move="${x.id}">移動狀態</button></div></div><h3>${esc(x.summary)}</h3><div class="muted" style="font-size:12px">窗口：${esc(x.owner||'未指派')} ${x.email?'· '+esc(x.email):''}</div>${extra}<div class="muted" style="font-size:12px;margin-top:12px">參考資料：${esc(x.refs||'—')}</div>${page==='待決策'?`<div class="actions"><button class="secondary small" data-decision="${x.id}">＋ 營運長決策</button></div>`:''}${['待追蹤','回報'].includes(page)?`<div class="actions"><button class="secondary small" data-note="${x.id}">＋ 營運長註記</button>${page==='待追蹤'?`<button class="secondary small" data-track="${x.id}">＋ 新增追蹤紀錄</button>`:''}</div>`:''}</article>`}
function render(){nav();$('pageTitle').textContent=page;$('subtitle').textContent=desc[tabs.indexOf(page)];let list=filtered();$('content').innerHTML=list.length?list.map(card).join(''):'<div class="panel empty">目前沒有符合條件的事項</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(+b.dataset.edit));document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(+b.dataset.move));document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>action(+b.dataset.decision,'decision'));document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>action(+b.dataset.track,'track'));document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>noteForm(+b.dataset.note))}
function form(id=null){let x=items.find(z=>z.id===id)||{status:page,priority:'一般',dept:'PM',decision:[],tracking:[]};$('modalTitle').textContent=id?'編輯事項':'新增事項';$('modalBody').innerHTML=`<form id="itemForm"><div class="grid2">${field('事項摘要','summary',x.summary)}${select('狀態','status',tabs.slice(0,4),x.status||'待決策')}${select('優先級','priority',['低','一般','高','緊急'],x.priority||'一般')}${select('所屬部門','dept',['財務','設計','影音','PM','其他'],x.dept||'其他')}${field('內部窗口姓名','owner',x.owner)}${field('窗口 Email','email',x.email,'email')}</div><div id="decisionFields"><div class="section">待決策資訊</div><div class="grid3">${field('方案一','o1',x.options?.[0])}${field('方案二','o2',x.options?.[1])}${field('方案三','o3',x.options?.[2])}</div>${area('秘書建議','recommend',x.recommend)}${area('待追蹤事項','follow',x.follow)}</div><div id="executionFields"><div class="section">執行資訊</div>${area('執行方式／目前進度','progress',x.progress)}${field('預計期限','deadline',x.deadline,'date')}</div><div id="trackingFields"><div class="section">追蹤資訊</div>${field('追蹤對象','target',x.target)}${field('下次追蹤日期','next',x.next,'date')}</div><div id="reportFields"><div class="section">回報資訊</div>${area('完成成果','result',x.result)}${field('回報日期','reportDate',x.reportDate,'date')}</div>${field('參考資料／連結','refs',x.refs)}${['待追蹤','回報'].includes(x.status)?area('營運長註記','note',x.note):''}<div class="actions" style="justify-content:flex-end"><button type="button" class="secondary" id="cancel">取消</button><button class="primary">儲存事項</button></div></form>`;$('modal').classList.remove('hidden');let toggle=()=>{let st=$('itemForm').elements.status.value;[['decisionFields','待決策'],['executionFields','執行中'],['trackingFields','待追蹤'],['reportFields','回報']].forEach(([id,v])=>$(id).style.display=st===v?'block':'none')};$('itemForm').elements.status.onchange=toggle;toggle();$('cancel').onclick=close;$('itemForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries()),obj={...x,...v,options:[v.o1,v.o2,v.o3],created:x.created||new Date().toISOString().slice(0,10),decision:x.decision||[],tracking:x.tracking||[],id:id||Date.now()};delete obj.o1;delete obj.o2;delete obj.o3;if(id)items=items.map(z=>z.id===id?obj:z);else items.unshift(obj);save();close();render();toast('事項已儲存')}}
function move(id){let x=items.find(z=>z.id===id),v=prompt('請輸入新狀態：待決策／執行中／待追蹤／回報',x.status);if(!tabs.slice(0,4).includes(v))return;x.status=v;save();render();toast('狀態已更新')}
function action(id,type){let x=items.find(z=>z.id===id),decision=type==='decision';$('modalTitle').textContent=decision?'新增決策紀錄':'新增追蹤紀錄';$('modalBody').innerHTML=decision?`<form id="actionForm">${select('營運長最後選擇方案','choice',(x.options||[]).filter(Boolean).length?x.options.filter(Boolean):['方案一','方案二','方案三'])}${field('決策日期','date',new Date().toISOString().slice(0,10),'date')}${area('決策補充說明','memo')}<div class="actions" style="justify-content:flex-end"><button type="button" class="secondary" id="cancel">取消</button><button class="primary">保存決策紀錄</button></div></form>`:`<form id="actionForm">${field('聯絡對象','person',x.target)}${field('聯絡日期','date',new Date().toISOString().slice(0,10),'date')}${area('回覆內容','reply')}${field('下一次追蹤日期','next','','date')}<div class="actions" style="justify-content:flex-end"><button type="button" class="secondary" id="cancel">取消</button><button class="primary">保存追蹤紀錄</button></div></form>`;$('modal').classList.remove('hidden');$('cancel').onclick=close;$('actionForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());if(decision){x.decision=x.decision||[];x.decision.push(v);x.status='執行中'}else{x.tracking=x.tracking||[];x.tracking.push(v);x.target=v.person;x.next=v.next}save();close();render();toast(decision?'決策紀錄已保存':'追蹤紀錄已保存')}}
function noteForm(id){let x=items.find(z=>z.id===id);$('modalTitle').textContent='營運長註記';$('modalBody').innerHTML=`<form id="noteForm">${area('營運長註記','note',x.note,'輸入指示、補充意見或後續要求…')}<div class="actions" style="justify-content:flex-end"><button type="button" class="secondary" id="cancel">取消</button><button class="primary">儲存註記</button></div></form>`;$('modal').classList.remove('hidden');$('cancel').onclick=close;$('noteForm').onsubmit=e=>{e.preventDefault();x.note=new FormData(e.target).get('note');save();close();render();toast('營運長註記已保存')}}
$('add').onclick=()=>form();$('close').onclick=close;$('search').oninput=render;$('priority').onchange=render;$('dept').onchange=render;render();
})();
</script></body></html>
